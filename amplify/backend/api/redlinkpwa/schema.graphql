# 1. CLINIQUE & VÉTÉRINAIRES
# ---------------------------------------------------------

type Clinic @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Veterinarians"], operations: [create, read, update] },
  { allow: private, operations: [read] }
]) {
  id: ID!
  name: String!
  rpps: String!
  email: String!
  phone: String!
  address: String!
  latitude: Float
  longitude: Float
  hasEmergencyService: Boolean!

  transfusionsDone: Int
  donorOwnersCount: Int

  # 👇 CORRECTIONS ICI : Ajout des indexName et fields
  veterinarians: [Veterinarian] @hasMany(indexName: "byClinicVet", fields: ["id"])
  requests: [Request] @hasMany(indexName: "byClinicRequest", fields: ["id"])
  clients: [ClinicOwnerRelation] @hasMany(indexName: "byClinicClient", fields: ["id"])
}

type Veterinarian @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Admins"], operations: [read, delete] },
  { allow: private, operations: [read] }
]) {
  id: ID! # = COGNITO SUB
  firstname: String!
  lastname: String!
  email: String!

  clinicID: ID! @index(name: "byClinicVet")
  clinic: Clinic @belongsTo(fields: ["clinicID"])

  # Optionnel : Liste des missions validées (nécessite index dans Mission si activé pleinement)
  validatedMissions: [Mission] @hasMany
}

# 2. PROPRIÉTAIRES & ANIMAUX
# ---------------------------------------------------------

type Owner @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Veterinarians"], operations: [read] }
]) {
  id: ID! # = COGNITO SUB
  firstname: String!
  lastname: String!
  email: String!
  phone: String!
  address: String!
  latitude: Float
  longitude: Float
  maxTravelDistance: Int!
  totalDonations: Int

  # 👇 CORRECTIONS ICI :
  animals: [Animal] @hasMany(indexName: "byOwnerAnimal", fields: ["id"])
  availabilities: [OwnerAvailability] @hasMany(indexName: "byOwnerAvail", fields: ["id"])
  myClinics: [ClinicOwnerRelation] @hasMany(indexName: "byOwnerClient", fields: ["id"])
}

type OwnerAvailability @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Veterinarians"], operations: [read] }
]) {
  id: ID!
  dayOfWeek: Int!
  startTime: AWSTime!
  endTime: AWSTime!

  ownerID: ID! @index(name: "byOwnerAvail")
  ownerProfile: Owner @belongsTo(fields: ["ownerID"])
}

type Animal @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Veterinarians"], operations: [read] }
]) {
  id: ID!
  name: String!
  species: Species!
  breed: String
  birthDate: AWSDate
  weight: Float!
  bloodGroup: String!
  isVaccinated: Boolean!
  isSterilized: Boolean
  lastDonationDate: AWSDate
  donationFrequency: DonationFrequency

  # @auth au niveau champ (remplace, pour ces deux champs uniquement, les règles de
  # type ci-dessus — Transformer v1 ne les fusionne pas) : Owner en lecture seule,
  # écriture réservée aux Veterinarians. Voir docs/adr/0002 (amendement 2026-08-12).
  isValidatedDonor: Boolean
    @auth(rules: [
      { allow: owner, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [read, update] }
    ])
  validationExpiresAt: AWSDateTime
    @auth(rules: [
      { allow: owner, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [read, update] }
    ])

  ownerID: ID! @index(name: "byOwnerAnimal")
  ownerProfile: Owner @belongsTo(fields: ["ownerID"])
  missions: [Mission] @hasMany(indexName: "byAnimalMission", fields: ["id"])
}

type ClinicOwnerRelation @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Veterinarians"] }
]) {
  id: ID!
  clinicID: ID! @index(name: "byClinicClient")
  clinic: Clinic @belongsTo(fields: ["clinicID"])
  ownerID: ID! @index(name: "byOwnerClient")
  ownerProfile: Owner @belongsTo(fields: ["ownerID"])
  isPrimaryClinic: Boolean
}

# 3. OPÉRATIONS
# ---------------------------------------------------------

type Request @model @auth(rules: [
  { allow: groups, groups: ["Veterinarians"] },
  # "update" est requis ici : linkRequestToMission (appelée par acceptMission) fait un
  # updateRequest en tant qu'Owner pour passer la Request en IN_PROGRESS. Sans cette règle,
  # l'acceptation d'une Mission par un Owner échoue au niveau @auth.
  # NB : un scoping plus fin (mutation dédiée ne touchant que le statut, à la ADR-0002 pour
  # la validation véto) serait plus propre mais empiéterait sur l'écriture conditionnelle
  # atomique prévue par l'ADR-0001 pour la Phase 0.3 — volontairement hors périmètre ici.
  { allow: private, operations: [read, update] }
]) {
  id: ID!
  requestType: RequestType!
  requiredSpecies: Species!
  requiredBloodGroup: String!
  quantity: Int!
  status: RequestStatus!
  createdAt: AWSDateTime

  clinicID: ID! @index(name: "byClinicRequest")
  clinic: Clinic @belongsTo(fields: ["clinicID"])

  activeMissionID: ID
  mission: Mission @hasOne(fields: ["activeMissionID"])
}

type Mission @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Veterinarians"] }
]) {
  id: ID!
  requestID: ID! @index(name: "byRequestMission")
  request: Request @belongsTo(fields: ["requestID"])

  animalID: ID! @index(name: "byAnimalMission")
  animal: Animal @belongsTo(fields: ["animalID"])

  status: MissionStatus!
  appointmentDatetime: AWSDateTime

  validationCode: String
  scannedAt: AWSDateTime

  # Note : Si vous voulez lister les missions par véto, ajoutez @index(name: "byVet") ici
  validatedByVeterinarianID: ID
  validatedBy: Veterinarian @belongsTo(fields: ["validatedByVeterinarianID"])

  stripePaymentIntentId: String
  stripePaymentStatus: String
}

# 4. ENUMS
# ---------------------------------------------------------

enum Species {
  DOG
  CAT
}

enum DonationFrequency {
  ASAP
  TWICE_YEAR
  ONCE_YEAR
}

enum RequestType {
  EMERGENCY
  APPOINTMENT
}

enum RequestStatus {
  OPEN
  IN_PROGRESS
  CLOSED
  CANCELLED
}

enum MissionStatus {
  ACCEPTED
  PENDING_ARRIVAL
  EN_ROUTE
  ARRIVED
  COMPLETED
  NO_SHOW
}