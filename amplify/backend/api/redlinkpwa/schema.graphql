# ==========================================================
# REDLINK - SCHÉMA GRAPHQL MVP (FINAL)
# ==========================================================

# 1. CLINIQUE & VÉTÉRINAIRES
# ---------------------------------------------------------

type Clinic @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Veterinarians"], operations: [create, read, update] },
  { allow: private, operations: [read] }
]) {
  id: ID!
  name: String!
  rpps: String!
  email: String!
  phone: String!
  address: String!
  latitude: Float
  longitude: Float
  hasEmergencyService: Boolean!

  transfusionsDone: Int
  donorOwnersCount: Int

  # 👇 CORRECTIONS ICI : Ajout des indexName et fields
  veterinarians: [Veterinarian] @hasMany(indexName: "byClinicVet", fields: ["id"])
  requests: [Request] @hasMany(indexName: "byClinicRequest", fields: ["id"])
  clients: [ClinicOwnerRelation] @hasMany(indexName: "byClinicClient", fields: ["id"])
}

type Veterinarian @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Admins"], operations: [read, delete] },
  { allow: private, operations: [read] }
]) {
  id: ID! # = COGNITO SUB
  firstname: String!
  lastname: String!
  email: String!

  clinicID: ID! @index(name: "byClinicVet")
  clinic: Clinic @belongsTo(fields: ["clinicID"])

  # Optionnel : Liste des missions validées (nécessite index dans Mission si activé pleinement)
  validatedMissions: [Mission] @hasMany
}

# 2. PROPRIÉTAIRES & ANIMAUX
# ---------------------------------------------------------

type Owner @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Veterinarians"], operations: [read] }
]) {
  id: ID! # = COGNITO SUB
  firstname: String!
  lastname: String!
  email: String!
  phone: String!
  address: String!
  latitude: Float
  longitude: Float
  maxTravelDistance: Int!
  totalDonations: Int

  # 👇 CORRECTIONS ICI :
  animals: [Animal] @hasMany(indexName: "byOwnerAnimal", fields: ["id"])
  availabilities: [OwnerAvailability] @hasMany(indexName: "byOwnerAvail", fields: ["id"])
  myClinics: [ClinicOwnerRelation] @hasMany(indexName: "byOwnerClient", fields: ["id"])
}

type OwnerAvailability @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Veterinarians"], operations: [read] }
]) {
  id: ID!
  dayOfWeek: Int!
  startTime: AWSTime!
  endTime: AWSTime!

  ownerID: ID! @index(name: "byOwnerAvail")
  ownerProfile: Owner @belongsTo(fields: ["ownerID"])
}

type Animal @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Veterinarians"], operations: [read] }
]) {
  id: ID!
  name: String!
  species: Species!
  breed: String
  birthDate: AWSDate
  weight: Float!
  bloodGroup: String!
  isVaccinated: Boolean!
  isSterilized: Boolean

  # @auth au niveau champ (remplace, pour ce champ, les règles de type ci-dessus —
  # Transformer v1 ne les fusionne pas) : Owner en lecture seule, écriture réservée aux
  # Veterinarians. Même mécanisme qu'isValidatedDonor/validationExpiresAt juste en-dessous
  # (ADR-0002) : la clôture d'une Mission en COMPLETED (Phase 2.1) doit pouvoir écrire cette
  # date sans ouvrir un accès en écriture général sur Animal aux Veterinarians (ce qui leur
  # permettrait de modifier des champs saisis par l'Owner — nom, race, poids...). Voir
  # docs/adr/0003.
  lastDonationDate: AWSDate
    @auth(rules: [
      { allow: owner, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [read, update] }
    ])
  donationFrequency: DonationFrequency

  # @auth au niveau champ (remplace, pour ces deux champs uniquement, les règles de
  # type ci-dessus — Transformer v1 ne les fusionne pas) : Owner en lecture seule,
  # écriture réservée aux Veterinarians. Voir docs/adr/0002 (amendement 2026-08-12).
  isValidatedDonor: Boolean
    @auth(rules: [
      { allow: owner, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [read, update] }
    ])
  validationExpiresAt: AWSDateTime
    @auth(rules: [
      { allow: owner, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [read, update] }
    ])

  ownerID: ID! @index(name: "byOwnerAnimal")
  ownerProfile: Owner @belongsTo(fields: ["ownerID"])
  missions: [Mission] @hasMany(indexName: "byAnimalMission", fields: ["id"])
}

type ClinicOwnerRelation @model @auth(rules: [
  # ownerField explicite : ces lignes sont toujours écrites côté Veterinarian
  # (useMissionClosure.js), jamais par l'Owner lui-même. Sans ownerField, la règle
  # `owner` se serait appuyée sur le champ caché auto-injecté (identité de qui écrit
  # la ligne, donc toujours le Vet) au lieu du champ `ownerID` du schéma (identité
  # réelle du pet Owner), et clinicOwnerRelationsByOwnerID serait resté vide en
  # permanence côté Owner.
  { allow: owner, ownerField: "ownerID" },
  { allow: groups, groups: ["Veterinarians"] }
]) {
  id: ID!
  clinicID: ID! @index(name: "byClinicClient")
  clinic: Clinic @belongsTo(fields: ["clinicID"])
  ownerID: ID! @index(name: "byOwnerClient")
  ownerProfile: Owner @belongsTo(fields: ["ownerID"])
  isPrimaryClinic: Boolean
}

# 3. OPÉRATIONS
# ---------------------------------------------------------

type Request @model @auth(rules: [
  { allow: groups, groups: ["Veterinarians"] },
  # "update" est requis ici : linkRequestToMission (appelée par acceptMission) fait un
  # updateRequest en tant qu'Owner pour passer la Request en IN_PROGRESS. Sans cette règle,
  # l'acceptation d'une Mission par un Owner échoue au niveau @auth.
  # NB : un scoping plus fin (mutation dédiée ne touchant que le statut, à la ADR-0002 pour
  # la validation véto) serait plus propre mais empiéterait sur l'écriture conditionnelle
  # atomique prévue par l'ADR-0001 pour la Phase 0.3 — volontairement hors périmètre ici.
  # Le champ `update` ci-dessus reste large au niveau type ; restreint plus finement au
  # niveau champ ci-dessous (revue DevSecOps, Phase 5) : sans ce second niveau, cette règle
  # autorisait n'importe quel Owner authentifié à réécrire N'IMPORTE QUEL champ de
  # N'IMPORTE QUELLE Request via un appel updateRequest direct (y compris d'une autre
  # clinique) — pas seulement status/activeMissionID comme linkRequestToMission en a besoin.
  { allow: private, operations: [read, update] }
]) {
  id: ID!

  # @auth au niveau champ (remplace, pour ces champs, les règles de type ci-dessus —
  # Transformer v1 ne les fusionne pas) : Owner en lecture seule, écriture réservée aux
  # Veterinarians (create : createRequestSimple : à la création de la Request ; update non
  # inclus, aucun code applicatif ne réécrit ces champs après création — à étendre si un futur
  # besoin d'édition apparaît). `status`/`activeMissionID` restent hors de cette liste : ce
  # sont les deux seuls champs que linkRequestToMission (Owner, à l'acceptation) écrit.
  requestType: RequestType!
    @auth(rules: [
      { allow: private, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [create, read] }
    ])
  requiredSpecies: Species!
    @auth(rules: [
      { allow: private, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [create, read] }
    ])
  requiredBloodGroup: String!
    @auth(rules: [
      { allow: private, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [create, read] }
    ])
  quantity: Int!
    @auth(rules: [
      { allow: private, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [create, read] }
    ])
  status: RequestStatus!
  createdAt: AWSDateTime
    @auth(rules: [
      { allow: private, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [create, read] }
    ])

  clinicID: ID!
    @index(name: "byClinicRequest")
    @auth(rules: [
      { allow: private, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [create, read] }
    ])
  clinic: Clinic @belongsTo(fields: ["clinicID"])

  activeMissionID: ID
  mission: Mission @hasOne(fields: ["activeMissionID"])
}

type Mission @model @auth(rules: [
  # Restreint aux opérations réellement utilisées (revue DevSecOps, Phase 5) : sans ces
  # `operations`, la règle owner à elle seule autorisait un Owner authentifié à appeler
  # updateMission(status: COMPLETED) (ou écrire validatedByVeterinarianID) directement sur sa
  # propre Mission — contournant useMissionClosure.js et cassant la garantie centrale de la
  # Phase 2 ("l'Owner ne peut pas s'auto-valider sa Mission comme terminée"). L'Owner voit
  # toujours le statut (read) mais ne peut plus l'écrire ; seuls createMissionSimple/
  # deleteMissionSimple (jamais updateMission) sont appelés côté Owner (useOwnerMissions.js).
  { allow: owner, operations: [create, read, delete] },
  { allow: groups, groups: ["Veterinarians"], operations: [read, update] }
]) {
  id: ID!
  requestID: ID! @index(name: "byRequestMission")
  request: Request @belongsTo(fields: ["requestID"])

  animalID: ID! @index(name: "byAnimalMission")
  animal: Animal @belongsTo(fields: ["animalID"])

  status: MissionStatus!
  appointmentDatetime: AWSDateTime

  # @auth au niveau champ (revue graphql-schema-reviewer, Phase 5) : retirer `update` au
  # niveau type à la règle owner (ci-dessus) ne suffisait pas — `create` y restait, et sans
  # @auth de niveau champ un Owner pouvait fabriquer directement un `createMission(status:
  # COMPLETED, validatedByVeterinarianID: "...")`, usurpant une validation vétérinaire dès la
  # création plutôt que par une `update` bloquée. Ces 5 champs sont par ailleurs inutilisés
  # par tout code applicatif actuel (flow QR-scan abandonné, Stripe hors périmètre V1 — voir
  # CLAUDE.md) : aucune régression possible à les verrouiller entièrement aux Veterinarians.
  # `status` lui-même reste hors de ce scoping champ-par-champ : createMissionSimple (Owner,
  # useOwnerMissions.js) doit pouvoir l'écrire à la création (PENDING_ARRIVAL/ACCEPTED) — le
  # Transformer v1 ne sait pas restreindre un champ à un sous-ensemble de valeurs par
  # opération, seulement à des opérations entières. Un Owner peut donc toujours fabriquer un
  # `createMission(status: COMPLETED)` en appelant l'API GraphQL directement (hors UI) ; limite
  # connue, non fermée par ce commit — voir la discussion Phase 5 dans la roadmap.
  validationCode: String
    @auth(rules: [
      { allow: owner, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [read, update] }
    ])
  scannedAt: AWSDateTime
    @auth(rules: [
      { allow: owner, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [read, update] }
    ])

  # Note : Si vous voulez lister les missions par véto, ajoutez @index(name: "byVet") ici
  validatedByVeterinarianID: ID
    @auth(rules: [
      { allow: owner, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [read, update] }
    ])
  validatedBy: Veterinarian @belongsTo(fields: ["validatedByVeterinarianID"])

  stripePaymentIntentId: String
    @auth(rules: [
      { allow: owner, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [read, update] }
    ])
  stripePaymentStatus: String
    @auth(rules: [
      { allow: owner, operations: [read] },
      { allow: groups, groups: ["Veterinarians"], operations: [read, update] }
    ])
}

# 4. ENUMS
# ---------------------------------------------------------

enum Species {
  DOG
  CAT
}

enum DonationFrequency {
  ASAP
  TWICE_YEAR
  ONCE_YEAR
}

enum RequestType {
  EMERGENCY
  APPOINTMENT
}

enum RequestStatus {
  OPEN
  IN_PROGRESS
  CLOSED
  CANCELLED
}

enum MissionStatus {
  ACCEPTED
  PENDING_ARRIVAL
  EN_ROUTE
  ARRIVED
  COMPLETED
  NO_SHOW
}